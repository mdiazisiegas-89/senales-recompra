name: Señales diarias

on:
  schedule:
    # GitHub puede retrasar estas horas más de una hora. Por eso hay varias pasadas:
    # la primera que deja el cierre de ayer completo congela el archivo del día.
    - cron: "12 5 * * *"
    - cron: "42 5 * * *"
    - cron: "12 6 * * *"
    - cron: "42 6 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:

concurrency:
  group: senales
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar si el archivo de hoy ya está completo
        id: previo
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          listo = False
          if os.environ["EVENTO"] == "schedule":
              try:
                  d = json.load(open("salida/senales_latest.json", encoding="utf-8"))
                  ayer = (datetime.now(timezone.utc) - timedelta(days=1)).strftime("%Y-%m-%d")
                  r = [d["btc"]["resumen"], d["sol"]["resumen"]]
                  listo = d.get("estado") != "FALLO" and all(
                      x.get("dato_diario_al_dia") is True and x.get("precio_referencia_fecha") == ayer
                      for x in r)
              except Exception as e:
                  print("No se pudo comprobar el archivo anterior:", e)
          print("Archivo de hoy completo:", listo)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"listo={'true' if listo else 'false'}\n")
          PY
      - uses: actions/setup-python@v5
        if: steps.previo.outputs.listo != 'true'
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.previo.outputs.listo != 'true'
      - name: Generar señales
        if: steps.previo.outputs.listo != 'true'
        id: gen
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python senales.py
      - name: Guardar en el repositorio
        if: steps.previo.outputs.listo != 'true'
        run: |
          git config user.name "senales-bot"
          git config user.email "senales-bot@users.noreply.github.com"
          git add salida
          git diff --cached --quiet || git commit -m "Señales $(date -u +%F)"
          git pull --rebase
          git push
      - name: Avisar si hubo fallo crítico
        if: steps.gen.outcome == 'failure'
        run: exit 1
