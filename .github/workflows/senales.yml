name: Señales diarias

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:

concurrency:
  group: senales
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar señales
        id: gen
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python senales.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "senales-bot"
          git config user.email "senales-bot@users.noreply.github.com"
          git add salida
          git diff --cached --quiet || git commit -m "Señales $(date -u +%F)"
          git pull --rebase
          git push
      - name: Avisar si hubo fallo crítico
        if: steps.gen.outcome == 'failure'
        run: exit 1
